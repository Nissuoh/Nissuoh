<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">Nissuoh</title>
  <desc id="d">Nissuoh, Founder and Lead Architect at SAMI, Frankfurt, Germany. A row of ten council seats: nine vote yes, one vetoes, and a line loops back to the first seat. One veto sends the work back.</desc>
  <style>
    .bg{fill:#0D2A36}
    .edge{fill:none;stroke:#17404F;stroke-width:2}
    .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
    .sans{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .eyebrow{font-size:20px;letter-spacing:3.4px;fill:#9CC6C8}
    .name{font-size:96px;letter-spacing:-1.5px;fill:#EAF6F3}
    .role{font-size:28px;fill:#EAF6F3}
    .role .hl{font-weight:700;fill:#6FD9C6}
    .thesis{font-size:28px;font-style:italic;fill:#9CC6C8}
    .ring{fill:none;stroke:#6FD9C6;stroke-width:3}
    .dot{fill:#6FD9C6}
    .vring{fill:none;stroke:#FF6B8E;stroke-width:3}
    .vx{fill:none;stroke:#FF6B8E;stroke-width:4;stroke-linecap:round}
    .arc{fill:none;stroke:#FF6B8E;stroke-width:3;stroke-linecap:butt;stroke-dasharray:100}
    .head{fill:#FF6B8E}
    .gap{fill:#0D2A36}
    .cap{font-size:20px;letter-spacing:2.4px;fill:#FF6B8E}
    .pulse{fill:none;stroke:#FF6B8E;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
    .ghost{opacity:0}
    .seat,.ghost{transform-box:fill-box;transform-origin:center}
    .seat{animation:cast .45s cubic-bezier(.2,.8,.2,1) backwards}
    .ghost{animation:ghost 1.03s linear .97s backwards}
    .pulse{animation:pulse .9s ease-out 2s}
    .arc{animation:draw .95s ease-in-out 2.25s backwards}
    .head{animation:fade .4s ease-out 3.1s backwards}
    .capg{animation:fade .6s ease-out 3.2s backwards}
    @keyframes cast{from{opacity:0;transform:scale(.4)}}
    @keyframes ghost{0%{opacity:0;transform:scale(.4);animation-timing-function:cubic-bezier(.2,.8,.2,1)}40%{opacity:1;transform:scale(1)}88%{opacity:1}100%{opacity:0}}
    @keyframes pulse{0%{opacity:0}1%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
    @keyframes draw{from{stroke-dashoffset:100}}
    @keyframes fade{from{opacity:0}}
    @media (prefers-reduced-motion:reduce){.seat,.ghost,.pulse,.arc,.head,.capg{animation:none}}
  </style>

  <rect class="bg" width="1280" height="300" rx="20"/>
  <rect class="edge" x="1" y="1" width="1278" height="298" rx="19"/>

  <text class="mono eyebrow" x="64" y="44">FRANKFURT, GERMANY</text>
  <text class="serif name" x="64" y="128">Nissuoh</text>
  <text class="sans role" x="64" y="166">Founder &amp; Lead Architect @ <tspan class="hl">SAMI</tspan></text>
  <text class="serif thesis" x="1216" y="92" text-anchor="end">AI can write code.</text>
  <text class="serif thesis" x="1216" y="128" text-anchor="end">The hard part is trusting it.</text>

  <!-- Council: ten seats. Nine vote yes, one vetoes. -->
  <g class="seat" style="animation-delay:.25s"><circle class="ring" cx="82" cy="210" r="19"/><circle class="dot" cx="82" cy="210" r="8.5"/></g>
  <g class="seat" style="animation-delay:.37s"><circle class="ring" cx="206" cy="210" r="19"/><circle class="dot" cx="206" cy="210" r="8.5"/></g>
  <g class="seat" style="animation-delay:.49s"><circle class="ring" cx="330" cy="210" r="19"/><circle class="dot" cx="330" cy="210" r="8.5"/></g>
  <g class="seat" style="animation-delay:.61s"><circle class="ring" cx="454" cy="210" r="19"/><circle class="dot" cx="454" cy="210" r="8.5"/></g>
  <g class="seat" style="animation-delay:.73s"><circle class="ring" cx="578" cy="210" r="19"/><circle class="dot" cx="578" cy="210" r="8.5"/></g>
  <g class="seat" style="animation-delay:.85s"><circle class="ring" cx="702" cy="210" r="19"/><circle class="dot" cx="702" cy="210" r="8.5"/></g>

  <!-- Seat 7: first casts a yes (animation only), then lands the veto. At rest only the veto is shown. -->
  <g class="ghost"><circle class="ring" cx="826" cy="210" r="19"/><circle class="dot" cx="826" cy="210" r="8.5"/></g>
  <circle class="pulse" cx="826" cy="210" r="19"/>
  <g class="seat" style="animation-delay:2s"><circle class="vring" cx="826" cy="210" r="19"/><path class="vx" d="M819 203 L833 217 M819 217 L833 203"/></g>

  <g class="seat" style="animation-delay:1.09s"><circle class="ring" cx="950" cy="210" r="19"/><circle class="dot" cx="950" cy="210" r="8.5"/></g>
  <g class="seat" style="animation-delay:1.21s"><circle class="ring" cx="1074" cy="210" r="19"/><circle class="dot" cx="1074" cy="210" r="8.5"/></g>
  <g class="seat" style="animation-delay:1.33s"><circle class="ring" cx="1198" cy="210" r="19"/><circle class="dot" cx="1198" cy="210" r="8.5"/></g>

  <!-- The veto sends the work back to the start. -->
  <path class="arc" pathLength="100" d="M826 235 C826 284 82 284 82 248"/>
  <path class="head" d="M82 233 L74.5 248 L89.5 248 Z"/>
  <g class="capg">
    <rect class="gap" x="234" y="262" width="440" height="24"/>
    <text class="mono cap" x="454" y="280" text-anchor="middle">ONE VETO SENDS THE WORK BACK</text>
  </g>
</svg>
